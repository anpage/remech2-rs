[package]
name = "remech2"
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"

[workspace]
members = ["crates/mw2-sys"]

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
# Include debug symbols in release builds for troubleshooting
debug = true

# Keep the smacker decoder optimized even in debug builds
[profile.dev.package.smk]
opt-level = 3

# Disable debug symbols for dependencies in release builds
[profile.release.package."*"]
debug = false

[dependencies]
anyhow = "1.0.98"
bytemuck = { version = "1.25", features = ["derive"] }
egui = "0.33.0"
egui-wgpu = "0.33.0"
egui-winit = { version = "0.33.0", default-features = false }
hex-literal = "1.0.0"
mw2-sys = { path = "crates/mw2-sys" }
pollster = "0.4.0"
rand = "0.9.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
rodio = { version = "0.21.1", default-features = false, features = [
    "mp3",
    "playback",
    "wav",
    "vorbis",
] }
rust-ini = "0.21.3"
rustysynth = "1.3.1"
sha2 = "0.10.9"
slotmap = { git = "https://github.com/anpage/slotmap.git", rev = "cf4a60416e07e09d8f16fb7bfe0a70808c944843" }
smk = "0.1.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
unarc-rs = "0.4.3"
wgpu = { version = "27.0.1", default-features = false, features = ["dx12", "vulkan", "wgsl"] }
winit = "0.30.12"
egui_plot = { version = "0.34.1", optional = true }

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
]

[features]
default = ["debug-overlay"]
debug-overlay = ["dep:egui_plot"]

[patch.crates-io]
smk = { git = "https://github.com/anpage/smk", branch = "fix-missing-tree" }
