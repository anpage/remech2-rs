[package]
name = "remech2"
version = "0.1.0-alpha.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = ["gamedisc", "remech2-sys"]

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
# Include debug symbols in release builds for troubleshooting
debug = true

[profile.dev.package.flacenc]
opt-level = 3

# Keep the smacker decoder optimized even in debug builds
[profile.dev.package.smk]
opt-level = 3

# Keep the game file check quick in debug builds
[profile.dev.package.crc32fast]
opt-level = 3

# Disable debug symbols for dependencies in release builds
[profile.release.package."*"]
debug = false

[profile.dev.package."*"]
debug = false

[dependencies]
anyhow = "1.0.98"
bytemuck = { version = "1.25", features = ["derive"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false }
gamedisc = { path = "gamedisc" }
gilrs-core = "0.6.8"
remech2-sys = { path = "remech2-sys" }
pollster = "1.0.1"
rand = "0.10.3"
rfd = "0.17.2"
rodio = { version = "0.23.0", default-features = false, features = [
    "playback",
    "wav",
    "vorbis",
    "mp3",
    "flac",
] }
rustysynth = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
slotmap = "1.1.1"
smk = "0.1.0"
toml = "1.1.6"
toml_edit = { version = "0.25.16", features = ["serde"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
wgpu = { version = "30.0.1", default-features = false, features = [
    "gles",
    "dx12",
    "vulkan",
    "wgsl",
] }
winit = "0.30.12"
egui_plot = { version = "0.37.0", optional = true }
directories = "6.0.0"
printf-compat = "0.5.0"
crc32fast = "1.5.2"

[features]
default = ["debug-overlay"]
debug-overlay = ["dep:egui_plot"]

[patch.crates-io]
smk = { git = "https://github.com/anpage/smk", branch = "fix-small-tree" }
