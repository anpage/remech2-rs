[package]
name = "remech2"
version = "0.1.0"
edition = "2024"
panic = "abort"

[dependencies]
anyhow = "1.0.98"
egui = "0.33.0"
egui-wgpu = "0.33.0"
futures-util = { version = "0.3.28", default-features = false }
hex-literal = "1.0.0"
pollster = "0.4.0"
rand = "0.9.1"
raw-window-handle = "0.6.2"
reqwest = { version = "0.12.15", features = ["stream"] }
retour = "0.4.0-alpha.4"
rodio = { version = "0.21.1", default-features = false, features = [
    "playback",
    "hound",
] }
rustysynth = "1.3.1"
sha2 = "0.10.9"
tokio = { version = "1.45.0", features = ["net", "rt-multi-thread"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
unarc-rs = "0.4.3"
web-time = "1.1.0"
wgpu = "27.0.1"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Media_Audio",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_Media_Multimedia",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
]
