name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: i686-pc-windows-gnu

      - name: Build Debug
        run: cargo build --target i686-pc-windows-gnu

      - name: Build Release
        run: cargo build --release --target i686-pc-windows-gnu

      - name: Archive Debug Build
        uses: actions/upload-artifact@v4
        with:
          name: ReMech2-Debug
          path: |
            target/i686-pc-windows-gnu/debug/remech2.exe

      - name: Archive Release Build
        uses: actions/upload-artifact@v4
        with:
          name: ReMech2-Release
          path: |
            target/i686-pc-windows-gnu/release/remech2.exe
