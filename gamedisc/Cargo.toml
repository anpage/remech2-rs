[package]
name = "gamedisc"
version = "0.1.0"
edition = "2024"

[dependencies]
cd-da-reader = "1.0.0"
flacenc = "0.5.1"
hadris-iso = "2.5.0"
thiserror = "2.0.21"
tracing = "0.1.44"
winnow = "1.0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
claxon = "0.4.3"
hadris-iso = { version = "2.5.0", features = ["write"] }
